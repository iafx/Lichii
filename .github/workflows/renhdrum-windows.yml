name: lichii-renhdrum-windows

# Lichii (nx2) + RenHDrum v0.2.1 HD Rumble / DualSense haptics, Windows x64.
# Run it from the Actions tab ("Run workflow") or by pushing to the renhdrum branch.
# By default it is the PGO build, as Lichii's windows-x86_64-pgo release: clang-cl with ThinLTO
# and lichii-windows.profdata (trained on Ocarina of Time). Untick "pgo" for the plain MSVC build.
on:
  workflow_dispatch:
    inputs:
      renhdrum_ref:
        description: RenHDrum tag or commit to build
        default: v0.2.1
      pgo:
        description: PGO build (clang-cl, ThinLTO, lichii-windows.profdata)
        type: boolean
        default: true
  push:
    branches:
      - renhdrum

permissions:
  contents: read

jobs:
  windows:
    name: ${{ (github.event_name != 'workflow_dispatch' || inputs.pgo) && 'windows-x86_64-pgo' || 'windows-x86_64' }} + RenHDrum
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      RENHDRUM_REF: ${{ inputs.renhdrum_ref || 'v0.2.1' }}
      PGO: ${{ (github.event_name != 'workflow_dispatch' || inputs.pgo) && 'true' || 'false' }}
      PLATFORM: ${{ (github.event_name != 'workflow_dispatch' || inputs.pgo) && 'windows-x86_64-pgo' || 'windows-x86_64' }}
      PROFILE: lichii-windows.profdata
    steps:
      - name: Check out Lichii
        uses: actions/checkout@v5

      - name: Check out RenHDrum
        uses: actions/checkout@v5
        with:
          repository: trzz1214/RenHDrum
          ref: ${{ env.RENHDRUM_REF }}
          path: _renhdrum

      # renhdrum.dll + renhdrum.dll.lib (MSVC import library) in _renhdrum/target/release
      - name: Build RenHDrum
        shell: bash
        working-directory: _renhdrum
        run: |
          set -euo pipefail
          rustup default stable-x86_64-pc-windows-msvc
          cargo build --release
          ls -la target/release/renhdrum.dll target/release/renhdrum.dll.lib

      # libusb for SDL's Switch 2 controller driver (Switch 2 Pro Controller / Joy-Con 2 over USB):
      # without it SDL leaves that driver out on Windows. SDL loads libusb-1.0.dll at run time, so
      # Lichii still starts without it; only those controllers need it.
      - name: Get libusb
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/libusb.7z" \
            https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.7z
          echo "7fb1dfec805b97983763d7d0ae244320da12add1003d4249c96cc4d586398c79  $RUNNER_TEMP/libusb.7z" | sha256sum -c -
          7z x -y -o_libusb "$RUNNER_TEMP/libusb.7z" > /dev/null
          ls -la _libusb/include/libusb.h _libusb/VS2022/MS64/dll/libusb-1.0.dll _libusb/VS2022/MS64/dll/libusb-1.0.lib

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # clang-cl compiles against the MSVC headers, libraries and SDK from the previous step; only
      # the compiler, linker and archiver come from this LLVM (the version Lichii's release uses,
      # which reads lichii-windows.profdata)
      - name: Install LLVM
        if: env.PGO == 'true'
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Check PGO profile
        if: env.PGO == 'true'
        shell: bash
        run: test -s "$PROFILE"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Restore CPM downloads
        uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-renhdrum-${{ env.PLATFORM }}-${{ hashFiles('cpmfile.json', '.patch/**', 'CMakeLists.txt', 'externals/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-renhdrum-${{ env.PLATFORM }}-
            cpm-renhdrum-windows-
            cpm-${{ env.PLATFORM }}-v2-

      - name: Restore compiler objects
        uses: actions/cache@v5
        with:
          path: .sccache
          # The profile's hash is in the key, so objects built against another profile never return
          key: objects-renhdrum-${{ env.PLATFORM }}-${{ hashFiles(env.PROFILE) }}-${{ github.sha }}
          restore-keys: |
            objects-renhdrum-${{ env.PLATFORM }}-${{ hashFiles(env.PROFILE) }}-

      # SDL3 is built from source with .patch/sdl3 (HD Rumble entry points) and linked statically:
      # externals/CMakeLists.txt forces that, whatever YUZU_USE_BUNDLED_SDL3 says.
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE//\\//}"
          args=(
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_TESTING=OFF
            -DYUZU_TESTS=OFF
            -DYUZU_CMD=ON
            -DYUZU_ROOM=OFF
            -DYUZU_ROOM_STANDALONE=OFF
            -DYUZU_USE_BUNDLED_QT=OFF
            -DENABLE_UPDATE_CHECKER=OFF
            -DLICHII_BUILD_TAG=renhdrum-${{ github.run_number }}
            "-DLICHII_BUILD_PLATFORM=$PLATFORM"
            -DUSE_DISCORD_PRESENCE=OFF
            "-DRENHDRUM_DIR=$ws/_renhdrum"
            "-DLibUSB_LIBRARY=$ws/_libusb/VS2022/MS64/dll/libusb-1.0.lib"
            "-DLibUSB_INCLUDE_PATH=$ws/_libusb/include"
            -DCMAKE_C_COMPILER_LAUNCHER=sccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          )
          if [ "$PGO" = true ]; then
            # Same compiler and flags as Lichii's windows-x86_64-pgo release. A profile older than
            # the source only warns: functions changed since training (ours included) lose their
            # profile data and are optimized as in a plain ThinLTO build.
            flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
            flags+=" -fprofile-use=$(cygpath -m "$PWD/$PROFILE")"
            flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
            flags+=" -Wno-error=backend-plugin"
            args+=(
              "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
              "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
              "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe"
              "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe"
              "-DCMAKE_C_FLAGS=$flags"
              "-DCMAKE_CXX_FLAGS=-EHsc $flags"
            )
          fi
          cmake -S . -B build/release -G Ninja "${args[@]}"

      # Fails early if SDL did not pick libusb up (no Switch 2 controller driver)
      - name: Check SDL has libusb
        shell: bash
        run: |
          set -euo pipefail
          config=$(grep -rl --include=SDL_build_config.h "SDL_JOYSTICK_HIDAPI" build/release | head -1)
          echo "SDL config: $config"
          grep -E "HAVE_LIBUSB|SDL_LIBUSB_DYNAMIC" "$config"
          grep -q "^#define HAVE_LIBUSB 1" "$config"

      - name: Build
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          sccache --show-stats

      # Never fails the job: when an earlier step failed the server was never started
      - name: Stop sccache
        if: always()
        shell: pwsh
        run: |
          sccache --stop-server
          exit 0

      - name: Package
        shell: pwsh
        run: |
          foreach ($f in 'lichii.exe', 'eden-cli.exe', 'renhdrum.dll') {
            if (-not (Test-Path "build/release/bin/$f")) { throw "build/release/bin/$f was not produced" }
          }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          Copy-Item _renhdrum/LICENSE-MIT build/release/bin/RENHDRUM-LICENSE-MIT.txt
          Copy-Item _renhdrum/LICENSE-APACHE build/release/bin/RENHDRUM-LICENSE-APACHE.txt
          # libusb for the Switch 2 controllers (LGPL-2.1-or-later, loaded at run time by SDL)
          Copy-Item _libusb/VS2022/MS64/dll/libusb-1.0.dll build/release/bin/
          Copy-Item _libusb/README.txt build/release/bin/LIBUSB-README.txt
          Set-Content build/release/bin/LIBUSB-LICENSE.txt ("libusb-1.0.dll is libusb 1.0.30, licensed under " +
            "the GNU Lesser General Public License 2.1 or later. Source code: " +
            "https://github.com/libusb/libusb/releases/tag/v1.0.30")
          Get-ChildItem build/release/bin -Exclude *.pdb, *.ilk, *.lib, *.exp |
            Compress-Archive -DestinationPath "lichii-renhdrum-$env:PLATFORM.zip"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: lichii-renhdrum-${{ env.PLATFORM }}-${{ github.sha }}
          path: lichii-renhdrum-${{ env.PLATFORM }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
